id: demo
name: 控件演示表
desc: 覆盖常用字段类型与编辑器控件，支持表格与卡片，以及批量修改/删除
default_sheet: items
views:
  - table
  - card
default_view: table
groups:
  - id: basic
    name: 基础信息
  - id: value
    name: 数值与开关
  - id: extra
    name: 展示与扩展
sheets:
  - id: items
    name: 道具
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
        group: basic
        hint: 英文标识，创建后不建议改
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
        group: basic
      - key: icon
        label: 图标
        type: icon
        widget: icon
        group: basic
        path: fixtures_res/item_icons/{id}.png
        hint: 按 path 模板展示，不落库
      - key: kind
        label: 分类
        type: enum
        widget: select
        group: basic
        enum: kinds
      - key: rarity
        label: 稀有度
        type: enum
        widget: radio
        group: basic
        enum: rarities
      - key: desc
        label: 描述
        type: string
        widget: textarea
        group: basic
      - key: enabled
        label: 启用
        type: bool
        widget: checkbox
        group: value
      - key: stack
        label: 堆叠上限
        type: int
        widget: number
        group: value
        min: 1
        max: 999
      - key: weight
        label: 重量
        type: float
        widget: number
        group: value
        step: 0.1
      - key: power
        label: 强度
        type: int
        widget: range
        group: value
        min: 0
        max: 100
      - key: available_from
        label: 上架日期
        type: date
        widget: date
        group: extra
      - key: tags
        label: 标签
        type: enum
        widget: multiselect
        group: extra
        enum: tags
        hint: 下拉多选，存枚举 id
  - id: kinds
    name: 分类
    kind: enum
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
  - id: rarities
    name: 稀有度
    kind: enum
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
  - id: tags
    name: 标签
    kind: enum
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
