name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
          - os: ubuntu-latest
            pack: pack:linux
          - os: macos-latest
            pack: pack:mac
    runs-on: ${{ matrix.os }}
    env:
      GOPROXY: https://proxy.golang.org,direct
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install zip
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Pack
        run: npm run ${{ matrix.pack }}
      - name: List pack output
        if: always()
        shell: bash
        run: ls -la dist/desktop || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.zip
            dist/desktop/**/*.zip
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            桌面工作台 zip（未签名）。解压后运行可执行文件。

            - Windows x64：`bit-tables-0.1.0-win-x64.zip`
            - Linux x64：`bit-tables-0.1.0-linux-x64.zip`
            - macOS Intel：`bit-tables-0.1.0-mac-x64.zip`
            - macOS Apple Silicon：`bit-tables-0.1.0-mac-arm64.zip`
