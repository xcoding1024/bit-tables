name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
          - os: ubuntu-latest
            pack: pack:linux
          - os: macos-latest
            pack: pack:mac
    runs-on: ${{ matrix.os }}
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Pack
        run: npm run ${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/desktop/*.zip
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
          body: |
            桌面工作台 zip（未签名）。解压后运行可执行文件。

            - Windows x64：`bit-tables-0.1.0-win-x64.zip`
            - Linux x64：`bit-tables-0.1.0-linux-x64.zip`
            - macOS Intel：`bit-tables-0.1.0-mac-x64.zip`
            - macOS Apple Silicon：`bit-tables-0.1.0-mac-arm64.zip`
