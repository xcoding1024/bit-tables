id: sheet_demo
name: Sheet 控件演示表
desc: 道具用表格、礼包用卡片；覆盖常用字段与批量操作；稀有度/标签枚举引用 enum_demo
default_sheet: items
groups:
  - id: basic
    name: 基础信息
  - id: value
    name: 数值与开关
  - id: extra
    name: 展示与扩展
sheets:
  - id: items
    name: 道具
    view: table
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
        group: basic
        hint: 英文标识，创建后不建议改
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
        group: basic
      - key: icon
        label: 图标
        type: icon
        widget: icon
        group: basic
        path: res/item_icons/{id}.png
        hint: 按 path 模板展示，不落库
      - key: kind
        label: 分类
        type: enum
        widget: select
        group: basic
        enum: kinds
      - key: rarity
        label: 稀有度
        type: enum
        widget: radio
        group: basic
        enum: enum_demo.rarities
      - key: desc
        label: 描述
        type: string
        widget: textarea
        group: basic
      - key: enabled
        label: 启用
        type: bool
        widget: checkbox
        group: value
      - key: stack
        label: 堆叠上限
        type: int
        widget: number
        group: value
        min: 1
        max: 999
      - key: weight
        label: 重量
        type: float
        widget: number
        group: value
        step: 0.1
      - key: power
        label: 强度
        type: int
        widget: range
        group: value
        min: 0
        max: 100
      - key: available_from
        label: 上架日期
        type: date
        widget: date
        group: extra
      - key: tags
        label: 标签
        type: enum
        widget: multiselect
        group: extra
        enum: enum_demo.tags
        hint: 下拉多选，存枚举 id（跨表 enum_demo.tags）
      - key: params
        label: 自定义参数
        type: object
        widget: params
        group: extra
        hint: 对象结构随 kind 变化；表格摘要 + 弹窗编辑（形态由 editor 按分类写死）
  - id: packs
    name: 礼包
    view: card
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
        group: basic
        hint: 英文标识，创建后不建议改
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
        group: basic
      - key: icon
        label: 图标
        type: icon
        widget: icon
        group: basic
        path: res/item_icons/{id}.png
        hint: 按 path 模板展示，不落库
      - key: price
        label: 价格
        type: int
        widget: number
        group: value
        min: 0
      - key: bonus
        label: 加赠比例
        type: int
        widget: range
        group: value
        min: 0
        max: 100
      - key: enabled
        label: 上架
        type: bool
        widget: checkbox
        group: value
      - key: desc
        label: 说明
        type: string
        widget: textarea
        group: extra
      - key: tags
        label: 标签
        type: enum
        widget: multiselect
        group: extra
        enum: enum_demo.tags
  - id: kinds
    name: 分类
    kind: enum
    fields:
      - key: id
        label: ID
        type: string
        required: true
        widget: text
      - key: name
        label: 名称
        type: string
        required: true
        widget: text
